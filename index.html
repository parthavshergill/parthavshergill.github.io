<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parthav Shergill</title>
  <meta name="description" content="Founding Engineer building agent architectures for long context problems.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #1a1a1a;
      background: #fafafa;
      padding: 3rem 1.5rem;
      min-height: 100vh;
    }

    main {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 2.5rem;
      font-weight: 400;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .tagline {
      color: #666;
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }

    .bio {
      font-size: 1.1rem;
      margin-bottom: 2rem;
      color: #333;
    }

    .links {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-bottom: 3rem;
    }

    .links a {
      color: #0066cc;
      text-decoration: none;
      font-size: 1rem;
    }

    .links a:hover {
      text-decoration: underline;
    }

    #agent {
      border-top: 1px solid #e0e0e0;
      padding-top: 2rem;
    }

    #agent-input {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    #agent-input input {
      flex: 1;
      font-family: inherit;
      font-size: 1rem;
      color: #1a1a1a;
      background: transparent;
      border: none;
      outline: none;
    }

    #agent-input input::placeholder {
      color: #999;
    }

    #agent-input .key-btn {
      font-size: 0.75rem;
      color: #999;
      background: none;
      border: 1px solid #ddd;
      padding: 0.25rem 0.5rem;
      border-radius: 3px;
      cursor: pointer;
    }

    #agent-input .key-btn:hover {
      border-color: #bbb;
      color: #666;
    }

    #agent-input .key-btn.set {
      border-color: #9c9;
      color: #696;
    }

    #log {
      margin-top: 1.5rem;
      display: none;
    }

    #log.visible {
      display: block;
    }

    .turn {
      border-left: 2px solid #e0e0e0;
      padding-left: 1rem;
      margin: 1.5rem 0;
    }

    .turn-user {
      color: #666;
      margin-bottom: 0.75rem;
    }

    .turn-code {
      margin: 0.75rem 0;
    }

    .turn-code summary {
      font-size: 0.8rem;
      color: #999;
      cursor: pointer;
    }

    .turn-code pre {
      background: #f4f4f4;
      border-radius: 4px;
      padding: 0.75rem;
      margin-top: 0.5rem;
      font-family: 'SF Mono', Monaco, 'Courier New', monospace;
      font-size: 0.8rem;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .turn-response {
      color: #333;
    }

    .turn-response a {
      color: #0066cc;
    }

    .turn-response ul, .turn-response ol {
      margin: 0.5rem 0 0.5rem 1.5rem;
    }

    .turn-response li {
      margin: 0.25rem 0;
    }

    .turn-response code {
      background: #f4f4f4;
      padding: 0.1rem 0.3rem;
      border-radius: 3px;
      font-size: 0.9em;
    }

    .turn-error {
      color: #c44;
    }

    @media (max-width: 480px) {
      h1 { font-size: 2rem; }
      .tagline, .bio { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Parthav Shergill</h1>
    <p class="tagline">Founding Engineer · San Francisco Bay Area</p>
    <p class="bio">
      Building agent architectures for long context problems. Interested in systems that reason across large contexts, distributed computing meets AI, and how agents can work together to solve complex problems.
    </p>
    <div class="links">
      <a href="https://x.com/parthavshergill">X</a>
      <a href="https://github.com/parthavshergill">GitHub</a>
      <a href="https://www.linkedin.com/in/parthav-shergill/">LinkedIn</a>
    </div>

    <div id="agent">
      <div id="agent-input">
        <span style="color:#999">→</span>
        <input type="text" id="prompt" placeholder="modify this page..." autofocus>
        <button class="key-btn" id="key-btn" onclick="setKey()">key</button>
      </div>
      <div id="log"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/snarkdown@2.0.0/dist/snarkdown.umd.js"></script>
  <script>
    const PROXY_URL = 'https://claude-proxy.parthavshergill.workers.dev';
    let apiKey = localStorage.getItem('anthropic_key') || '';

    if (apiKey) document.getElementById('key-btn').classList.add('set');

    function setKey() {
      const key = prompt('Enter Anthropic API key:', apiKey);
      if (key !== null) {
        apiKey = key;
        localStorage.setItem('anthropic_key', key);
        document.getElementById('key-btn').classList.toggle('set', !!key);
      }
    }

    function getPageContext() {
      const clone = document.documentElement.cloneNode(true);
      clone.querySelector('#agent')?.remove();
      clone.querySelector('script')?.remove();
      return clone.outerHTML;
    }

    async function callClaude(messages) {
      const res = await fetch(PROXY_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          key: apiKey,
          model: 'claude-haiku-4-5-20251001',
          max_tokens: 4096,
          system: `You modify this webpage by executing JavaScript.

Current HTML:
${getPageContext()}

You have one tool: execute_js. Use it to modify the DOM.

Response format:
- First, call execute_js with your code
- Then respond briefly confirming what you did
- You can use markdown: **bold**, [links](url), and lists`,
          messages,
          tools: [{
            name: 'execute_js',
            description: 'Execute JavaScript to modify the page DOM',
            input_schema: {
              type: 'object',
              properties: {
                code: { type: 'string', description: 'JavaScript code to execute' }
              },
              required: ['code']
            }
          }]
        })
      });
      return res.json();
    }

    async function run(userPrompt) {
      const isLocal = PROXY_URL.includes('localhost');
      if (!apiKey && !isLocal) {
        setKey();
        if (!apiKey) return;
      }

      const logEl = document.getElementById('log');
      logEl.classList.add('visible');

      // Create turn container (prepend so newest is on top)
      const turn = document.createElement('div');
      turn.className = 'turn';
      logEl.prepend(turn);

      // User message
      const userMsg = document.createElement('div');
      userMsg.className = 'turn-user';
      userMsg.textContent = userPrompt;
      turn.appendChild(userMsg);

      const messages = [{ role: 'user', content: userPrompt }];
      let allCode = [];

      while (true) {
        const response = await callClaude(messages);

        if (response.error) {
          const errMsg = document.createElement('div');
          errMsg.className = 'turn-error';
          errMsg.textContent = response.error.message || response.error;
          turn.appendChild(errMsg);
          break;
        }

        let hasToolUse = false;
        const toolResults = [];
        let agentText = '';

        for (const block of response.content) {
          if (block.type === 'text' && block.text) {
            agentText += block.text;
          }

          if (block.type === 'tool_use' && block.name === 'execute_js') {
            hasToolUse = true;
            const code = block.input.code;
            allCode.push(code);

            let result;
            try {
              result = eval(code);
            } catch (e) {
              result = `Error: ${e.message}`;
            }

            toolResults.push({
              type: 'tool_result',
              tool_use_id: block.id,
              content: String(result ?? 'ok')
            });
          }
        }

        if (!hasToolUse) {
          // Collapsed code
          if (allCode.length > 0) {
            const details = document.createElement('details');
            details.className = 'turn-code';
            details.innerHTML = `<summary>code</summary><pre>${allCode.join('\n\n')}</pre>`;
            turn.appendChild(details);
          }

          // Agent response
          if (agentText.trim()) {
            const agentMsg = document.createElement('div');
            agentMsg.className = 'turn-response';
            agentMsg.innerHTML = snarkdown(agentText.trim());
            turn.appendChild(agentMsg);
          }
          break;
        }

        messages.push({ role: 'assistant', content: response.content });
        messages.push({ role: 'user', content: toolResults });
      }

    }

    document.getElementById('prompt').addEventListener('keydown', async (e) => {
      if (e.key === 'Enter' && e.target.value.trim()) {
        const prompt = e.target.value.trim();
        e.target.value = '';
        await run(prompt);
      }
    });
  </script>
</body>
</html>
