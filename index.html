<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parthav Shergill</title>
  <meta name="description" content="Founding Engineer building agent architectures for long context problems.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #1a1a1a;
      background: #fafafa;
      padding: 3rem 1.5rem;
    }

    main {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 2.5rem;
      font-weight: 400;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

      color: #666;

      margin-bottom: 2rem;
    }

    .bio {
      font-size: 1.1rem;
      margin-bottom: 2rem;
      color: #333;
    }

    .links {
      display: flex;

    }

    .links a {
      color: #0066cc;
      text-decoration: none;
      font-size: 1rem;
    }

    .links a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      h1 { font-size: 2rem; }
      .tagline, .bio { font-size: 1rem; }

<body>
  <main>

    </p>
    <div class="links">
      <a href="https://x.com/parthavshergill">X</a>
